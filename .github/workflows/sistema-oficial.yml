name: HÆMA — Sistema Mestre consolidado
on:
  push:
    branches: [feat/sistema-oficial-consolidado-20261125]
  pull_request:
    paths:
      - 'docs/SISTEMA_MESTRE_CONSOLIDADO_20261125.md'
      - 'rules-system-reference.js'
      - 'tests/system-reference.test.cjs'
      - 'tests/system-reference-browser.py'
      - 'sistema-oficial.html'
      - 'sistema.html'
      - 'manual-unificado.html'
      - 'index.html'
      - 'README.md'
      - '.github/workflows/sistema-oficial.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verificar manifesto, fórmulas e integridade editorial
        run: |
          node --check rules-system-reference.js
          node --check rules-unified-playtest.js
          node --test tests/system-reference.test.cjs
          node --test tests/arvore.test.js tests/arvore-viva.test.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Testar referência em Chromium · 360, 390, 1440
        run: |
          set -e
          python -m http.server 8791 --bind 127.0.0.1 >/tmp/haema-sistema.log 2>&1 &
          sleep 2
          python tests/system-reference-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sistema-oficial-screenshots
          path: artifacts/sistema-oficial/*.png
          retention-days: 7
          if-no-files-found: ignore
