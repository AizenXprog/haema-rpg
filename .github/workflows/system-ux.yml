name: HÆMA — Sistema didático e formatação
on:
  push:
    branches:
      - feat/sistema-unificado-didatico-20261123
  pull_request:
    paths:
      - 'sistema.html'
      - 'sistema-didatico.css'
      - 'sistema-didatico.js'
      - 'manual-unificado.html'
      - 'manual-unificado.js'
      - 'navigation.js'
      - 'inline-format.js'
      - 'volumes.js'
      - 'reserved-books.js'
      - 'library.js'
      - 'tests/system-ux-browser.py'
      - '.github/workflows/system-ux.yml'
concurrency:
  group: haema-system-ux
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  system-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Inspect JavaScript syntax
        run: |
          node --check sistema-didatico.js
          node --check manual-unificado.js
          node --check navigation.js
          node --check inline-format.js
          node --check volumes.js
          node --check reserved-books.js
          node --check library.js
      - name: Check real mobile and desktop navigation
        run: |
          set -e
          python -m http.server 8791 --bind 127.0.0.1 >/tmp/haema-system.log 2>&1 &
          sleep 2
          python tests/system-ux-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haema-system-ux-screenshots
          path: artifacts/system-ux/*.png
          retention-days: 7
          if-no-files-found: ignore
