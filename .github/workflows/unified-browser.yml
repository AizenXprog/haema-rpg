name: HÆMA — navegador real de pré-publicação
on:
  push:
    branches:
      - feat/manual-unificado-playtest-20261119
  pull_request:
    paths:
      - 'manual-unificado.html'
      - 'laboratorio-unificado.html'
      - 'tecnicas-unificadas.html'
      - 'navigation.js'
      - 'portal.js'
      - 'tests/unified-browser.py'
      - '.github/workflows/unified-browser.yml'
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Executar testes com navegador em 4 resoluções
        run: |
          set -e
          python -m http.server 8791 --bind 127.0.0.1 >/tmp/haema-server.log 2>&1 &
          sleep 2
          python tests/unified-browser.py
