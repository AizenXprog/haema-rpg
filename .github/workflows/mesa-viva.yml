name: HÆMA — Mesa ao Vivo
on:
  push:
    branches: [feat/mesa-viva-primeiro-lote-20261124]
  pull_request:
    paths:
      - 'painel-mestre.html'
      - 'painel-mestre.js'
      - 'painel-mestre.css'
      - 'painel-mesa-viva.js'
      - 'tests/mesa-viva.test.cjs'
      - 'tests/mesa-viva-browser.py'
      - 'docs/HAEMA_MESA_VIVA_20261124.sql'
      - '.github/workflows/mesa-viva.yml'
permissions:
  contents: read
jobs:
  mesa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: |
          node --check painel-mesa-viva.js
          node --check painel-mestre.js
          node --test tests/mesa-viva.test.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Testar sessão no Chromium com Supabase simulado
        run: |
          set -e
          python -m http.server 8791 --bind 127.0.0.1 >/tmp/haema-mesa-viva.log 2>&1 &
          sleep 2
          python tests/mesa-viva-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haema-mesa-viva-screenshots
          path: artifacts/mesa-viva/*.png
          retention-days: 7
          if-no-files-found: ignore
