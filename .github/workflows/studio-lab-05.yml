name: HÆMA Studio lab checks
on:
  pull_request:
    paths:
      - 'studio/**'
      - 'tests/studio-*.cjs'
      - 'estudio.html'
      - 'projecao.html'
      - '.github/workflows/studio-lab-05.yml'
permissions:
  contents: read
jobs:
  studio-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node version
        run: node --version
      - name: Run Studio regression suite
        run: |
          set -euo pipefail
          failures=0
          for test in tests/studio-*.cjs; do
            echo "Running $test"
            if ! node "$test"; then
              failures=$((failures+1))
            fi
          done
          echo "Studio suites with failures: $failures"
          test "$failures" -eq 0
