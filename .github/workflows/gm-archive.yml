name: HÆMA — Arquivo do Mestre e Bestiário
on:
  push:
    branches:
      - feat/arquivo-tecnico-mestre-bestiario-20261123
  pull_request:
    paths:
      - 'gm-workspace.js'
      - 'gm-workspace.css'
      - 'mestre.html'
      - 'portal.js'
      - 'portal.html'
      - 'campanha.html'
      - 'portal-hub.js'
      - 'navigation.js'
      - 'library.js'
      - 'tests/gm-archive-browser.py'
      - '.github/workflows/gm-archive.yml'
concurrency:
  group: haema-master-archive-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Syntax for all changed JavaScript
        run: |
          node --check gm-workspace.js
          node --check portal.js
          node --check navigation.js
          node --check portal-hub.js
          node --check library.js
      - name: Test authenticated GM, player and guest
        run: |
          set -e
          python -m http.server 8791 --bind 127.0.0.1 >/tmp/haema-master.log 2>&1 &
          sleep 2
          python tests/gm-archive-browser.py
          python tests/unified-portal-browser.py
          python tests/system-ux-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haema-master-archive-screenshots
          path: artifacts/gm-archive/*.png
          retention-days: 7
          if-no-files-found: ignore
