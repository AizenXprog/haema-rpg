name: HÆMA — Constelação clicável
on:
  push:
    branches:
      - fix/constelacao-click-ui-20261124
      - feat/constelacao-treinamentos-126-20261124
  pull_request:
    paths:
      - 'arvore.html'
      - 'arvore-data.js'
      - 'arvore-vivo.js'
      - 'arvore-viva.css'
      - 'arvore-catalogo-vivo.js'
      - 'arvore-treinamentos.js'
      - 'tests/arvore-viva.test.js'
      - 'tests/tree-click-browser.py'
      - '.github/workflows/constelacao-click.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: node --check arvore-vivo.js && node --check arvore-treinamentos.js && node --check arvore-catalogo-vivo.js && node --test tests/arvore.test.js tests/arvore-viva.test.js
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Clique real no Chromium sem tocar em dados do Supabase
        run: |
          set -e
          python -m http.server 8791 --bind 127.0.0.1 >/tmp/haema-tree.log 2>&1 &
          sleep 2
          python tests/tree-click-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haema-constelacao-smoke
          path: artifacts/tree-click/*.png
          retention-days: 7
          if-no-files-found: ignore
